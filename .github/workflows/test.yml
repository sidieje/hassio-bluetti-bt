name: Unittests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        # Pinned to match the interpreter the integration is developed and
        # shipped against. '3.x' silently tracks whatever Python the runner
        # image ships, so CI can run against a core/interpreter combination
        # nobody tests locally. Bump it together with homeassistant in
        # requirements.txt.
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run unittests
      run: python -m unittest discover -s tests -p "*.py"
