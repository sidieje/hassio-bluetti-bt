name: Unittests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        # Pinned to match the interpreter the integration is developed and
        # shipped against. '3.x' silently tracks the newest image Python, and
        # homeassistant does not publish its bluetooth dependency chain for
        # brand-new releases; on 3.15 the import of homeassistant.components.usb
        # fails and whole test modules are skipped.
        python-version: '3.13'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run unittests
      run: python3 -m unittest discover -s tests -p "*.py"
