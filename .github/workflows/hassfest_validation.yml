name: Validate with hassfest

on:
  push:
  pull_request:
  # No schedule: a nightly run can turn an upstream rule change into a red X on
  # this repo with no push from anyone, which reads as a failure with nothing to
  # act on. Use the manual trigger to re-check against current rules.
  workflow_dispatch:

jobs:
  validate:
    runs-on: "ubuntu-latest"
    steps:
        - uses: "actions/checkout@v3"
        - uses: "home-assistant/actions/hassfest@master"
