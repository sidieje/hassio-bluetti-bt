name: HACS Action

on:
  push:
  pull_request:
  # No schedule: a nightly run can turn a new HACS validation rule into a red X
  # on this repo with no push from anyone, which reads as a failure with nothing
  # to act on. Use the manual trigger to re-check against current rules.
  workflow_dispatch:

jobs:
  hacs:
    name: HACS Action
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS Action
        uses: "hacs/action@main"
        with:
          category: "integration"
